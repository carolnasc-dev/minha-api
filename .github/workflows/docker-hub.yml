name: CI-CD FastAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Build:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes com pytest
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
               carolinenascimento/senai_fastapi:latest
               carolinenascimento/senai_fastapi:${{ github.sha }}

  Deploy:
    name: Implantacao AWS
    runs-on: ubuntu-latest
    needs: Imagem
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull carolinenascimento/senai_fastapi:latest
            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true
            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
             carolinenascimento/senai_fastapi:latest
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy concluido com sucesso!"
            sudo docker image prune -f